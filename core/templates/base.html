<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Seeker Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #343a40;
            color: white;
            padding-top: 20px;
        }

        .sidebar a {
            padding: 15px 20px;
            text-decoration: none;
            color: white;
            display: block;
            font-size: 16px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #495057;
        }

        .content {
            margin-left: 250px;
            padding: 20px;
        }


        .content-body {

            margin-top: 7px;
        }
        .main-content {
    display: flex;
    flex-direction: column;
    height: 100vh; /* Ensure it takes full height */
}

.notification-container {
    flex-grow: 1; /* Allows the container to expand */
    max-height: 600px; /* Prevents notifications from overflowing */
    overflow-y: auto; /* Enables vertical scrolling */
    border: 1px solid #ddd;
    border-radius: 5px;
    padding: 10px;
    background: #fff;
}

/* Sidebar should not be affected by expanding content */
.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    height: 100vh;
    width: 250px;
    background-color: #343a40;
    padding-top: 20px;
    display: flex;
    flex-direction: column;
}

/* Content should not push sidebar */
.content {
    margin-top: 10px;
    margin-left: 250px;
    flex-grow: 1;
    padding: 20px;
    overflow: hidden;
}

/* Ensuring notifications don't cause layout shifts */
.list-group-item {
    word-wrap: break-word;
    white-space: normal;
    overflow-wrap: break-word;
}

.btn-success, .btn-danger {
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
}
    </style>
</head>

<body>
    <div class="sidebar">
        <h3 class="text-center text-white">Company Profile</h3>
        <a href="{% url 'employer_dashboard' %}">Dashboard</a>
        <a href="{% url 'notifications' %}">Notifications</a>
        <a href="{% url 'company_manage_jobs' %}">Manage Jobs</a>
        <a href="{% url 'company_post_job' %}">Post Job</a>
        <a href="{% url 'company_profile'%}">Profile</a>
    </div>

    <!-- Top Bar -->
    <!-- <div class="top-bar">
        <button onclick="handleLogout()">Logout</button>
    </div> -->

    <!-- Content Area -->
    <div class="content">
        <div class="content-body">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // function handleLogout() {
        //     window.location.href = "{% url 'logout' %}";
        // }
    </script>

</body>

</html>
