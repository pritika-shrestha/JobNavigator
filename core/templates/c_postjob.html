<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #333;
            color: white;
            padding-top: 20px;
        }

        .sidebar a {
            padding: 15px 20px;
            text-decoration: none;
            color: white;
            display: block;
            font-size: 16px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #575757;
        }

        .content {
            margin-left: 250px;
            padding: 20px;
        }

        h2 {
            font-size: 24px;
            font-weight: bold;
        }

        .salary-input {
            display: none;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h3 class="text-center text-white">Company Profile</h3>
        <a href="{% url 'employer_dashboard' %}">Dashboard</a>
        <a href="{% url 'notifications' %}">Notifications</a>
        <a href="{% url 'company_manage_jobs' %}">Manage Jobs</a>
        <a href="{% url 'company_post_job' %}">Post Job</a>
        <a href="{% url 'company_profile'%}">Profile</a>
    </div>

    <div class="content">
        <h2>Post a Job</h2>
        <form id="postJobForm" method="POST" action="{% url 'company_post_job' %}">
            {% csrf_token %}
            <!-- {{ form.as_p }} -->
            <div class="mb-3">
                <label for="JobTitle" class="form-label">Job Title</label>
                <input type="text" class="form-control" name="JobTitle" id="JobTitle" placeholder="Enter job title" required>
            </div>

            <div class="mb-3">
                <label for="JobDescription" class="form-label">Job Description</label>
                <textarea class="form-control" name="JobDescription" id="JobDescription" rows="4" placeholder="Enter job description" required></textarea>
            </div>

            <div class="mb-3">
                <label for="JobLocation" class="form-label">Job Location</label>
                <input type="text" class="form-control" name="JobLocation" id="JobLocation" placeholder="Enter job location" required>
            </div>

            <div class="mb-3">
                <label for="JobRequirements" class="form-label">Job Requirements</label>
                <textarea class="form-control" name="JobRequirements" id="JobRequirements" rows="4" placeholder="Enter job requirements" required></textarea>
            </div>

            <div class="mb-3">
                <label for="JobType" class="form-label">Job Type</label>
                <select class="form-control" name="JobType" id="JobType" required>
                    <option value="Full-time">Full-time</option>
                    <option value="Part-time">Part-time</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="ApplicationDeadline" class="form-label">Application Deadline</label>
                <input type="date" class="form-control" name="ApplicationDeadline" id="ApplicationDeadline" required>
            </div>

            <div class="mb-3">
                <label for="ManpowerRequired" class="form-label">Manpower Required</label>
                <input type="number" class="form-control" name="ManpowerRequired" id="ManpowerRequired" placeholder="Enter manpower required" required>
            </div>

            <div class="mb-3">
                <label for="SalaryType" class="form-label">Salary</label><br>
                <input type="radio" id="manualSalary" name="SalaryType" value="Manual" required>
                <label for="manualSalary">Manual</label><br>
                <input type="radio" id="rangeSalary" name="SalaryType" value="Range" required>
                <label for="rangeSalary">Range</label><br>
                <input type="radio" id="negotiableSalary" name="SalaryType" value="Negotiable" required>
                <label for="negotiableSalary">Negotiable</label>
            </div>

            <div id="manualSalaryInput" class="salary-input">
                <label for="SalaryManual" class="form-label">Enter Salary</label>
                <input type="number" class="form-control" id="SalaryManual" name="SalaryManual" placeholder="Enter exact salary">
            </div>

            <div id="salaryRangeInput" class="salary-input">
                <label for="SalaryRange" class="form-label">Enter Salary Range</label>
                <input type="number" class="form-control" id="SalaryRangeMin" name="SalaryRangeMin" placeholder="Enter minimum salary">
                <input type="number" class="form-control" id="SalaryRangeMax" name="SalaryRangeMax" placeholder="Enter maximum salary">
            </div>
            <button type="submit" class="btn btn-primary">Post Job</button>
        </form>
        
        <script>
            const manualSalaryRadio = document.getElementById('manualSalary');
            const rangeSalaryRadio = document.getElementById('rangeSalary');
            const negotiableSalaryRadio = document.getElementById('negotiableSalary');
            const manualSalaryInput = document.getElementById('manualSalaryInput');
            const salaryRangeInput = document.getElementById('salaryRangeInput');
        
            manualSalaryRadio.addEventListener('change', function () {
                manualSalaryInput.style.display = 'block';
                salaryRangeInput.style.display = 'none';
            });
        
            rangeSalaryRadio.addEventListener('change', function () {
                salaryRangeInput.style.display = 'block';
                manualSalaryInput.style.display = 'none';
            });
        
            negotiableSalaryRadio.addEventListener('change', function () {
                manualSalaryInput.style.display = 'none';
                salaryRangeInput.style.display = 'none';
            });
        
            // Ensure the right fields show up initially
            window.onload = function() {
                if (manualSalaryRadio.checked) {
                    manualSalaryInput.style.display = 'block';
                    salaryRangeInput.style.display = 'none';
                } else if (rangeSalaryRadio.checked) {
                    salaryRangeInput.style.display = 'block';
                    manualSalaryInput.style.display = 'none';
                } else {
                    manualSalaryInput.style.display = 'none';
                    salaryRangeInput.style.display = 'none';
                }
            };
        
            // Clear form fields after submission
            document.getElementById("postJobForm").addEventListener("submit", function(event) {
                event.preventDefault();  // Prevent the default form submission
                this.submit();  // Proceed with submission
                
                // Reset form after submission
                setTimeout(() => {
                    document.getElementById("postJobForm").reset();
                    manualSalaryInput.style.display = 'none';
                    salaryRangeInput.style.display = 'none';
                }, 500);
            });
        </script>
