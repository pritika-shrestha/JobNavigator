<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Seeker Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #343a40;
            color: white;
            padding-top: 20px;
        }

        .sidebar a {
            padding: 15px 20px;
            text-decoration: none;
            color: white;
            display: block;
            font-size: 16px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #495057;
        }

        .content {
            margin-left: 250px;
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f4f4f4;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
            position: fixed;
            width: calc(100% - 250px);
            top: 0;
            left: 250px;
        }

        .top-bar button {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease-in-out;
        }

        .top-bar button:hover {
            background-color: #575757;
        }

        .content-body {
            margin-top: 10px;
        }
        
        .notification-container {
        flex-grow: 1; /* Allows the container to expand */
        max-height: 600px; /* Prevents notifications from overflowing */
        overflow-y: auto; /* Enables vertical scrolling */
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 10px;
        background: #fff;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h3 class="text-center text-white">Job Seeker</h3>
        <a href="{% url 'jobseeker_dashboard' %}">Dashboard</a>
        <a href="{% url 'notifications' %}">Notifications</a>
        <a href="{% url 'jobseeker_recommendations' %}">Recommendations</a>
        <a href="{% url 'jobseeker_profile' %}">Profile</a>
    </div>

    <!-- Top Bar -->
    <!-- <div class="top-bar">
        <button onclick="handleLogout()">Logout</button>
    </div> -->

    <!-- Content Area -->
    <div class="content">
        <div class="content-body">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // function handleLogout() {
        //     window.location.href = "{% url 'logout' %}";
        // }
    </script>

</body>

</html>
