<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Profile Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #000000;
            margin: 0;
            padding: 0;
        }

        .content {
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 28px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .form-control,
        .form-select {
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 12px;
            margin-bottom: 15px;
            transition: all 0.3s ease-in-out;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #000000;
            box-shadow: 0 0 5px #000000;
        }

        .btn-submit {
            background-color: #000000;
            color: white;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out;
        }

        .btn-submit:hover {
            background-color: #333;
        }
    </style>
</head>

<body>

    <div class="content">
        <h2>Create Company Profile</h2>
        <div class="form-container">
            <form id="companyProfileForm"  method="POST" action="{% url 'employercv' %}">
                {% csrf_token %} <!-- Ensure this is correctly included -->
            
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label for="companyName" class="form-label">Company Name</label>
                    <input type="text" class="form-control" id="companyName" name="companyName" placeholder="Enter company name" required>
                </div>

                <div class="form-group">
                    <label for="companyEmail" class="form-label">Company Email</label>
                    <input type="email" class="form-control" id="companyEmail" name="companyEmail" placeholder="Enter company email" required>
                </div>

                <div class="form-group">
                    <label for="companyPhone" class="form-label">Company Phone</label>
                    <input type="text" class="form-control" id="companyPhone" name="companyPhone" placeholder="Enter company phone number" required>
                </div>

                <div class="form-group">
                    <label for="companyAddress" class="form-label">Company Address</label>
                    <textarea class="form-control" id="companyAddress" name="companyAddress" rows="4" placeholder="Enter company address" required></textarea>
                </div>

                <div class="form-group">
                    <label for="companyIndustry" class="form-label">Company Industry</label>
                    <input type="text" class="form-control" id="companyIndustry" name="companyIndustry" placeholder="Enter industry" required>
                </div>

                <div class="form-group">
                    <label for="companySize" class="form-label">Company Size</label>
                    <select class="form-select" id="companySize" name="companySize" required>
                        <option value="">Select company size</option>
                        <option value="Small">Small (1-50 employees)</option>
                        <option value="Medium">Medium (51-200 employees)</option>
                        <option value="Large">Large (200+ employees)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="contactPersonName" class="form-label">Contact Person Name</label>
                    <input type="text" class="form-control" id="contactPersonName" name="contactPersonName" placeholder="Enter contact person's name" required>
                </div>

                <div class="form-group">
                    <label for="contactPersonEmail" class="form-label">Contact Person Email</label>
                    <input type="email" class="form-control" id="contactPersonEmail" name="contactPersonEmail" placeholder="Enter contact person's email" required>
                </div>

                <div class="form-group">
                    <label for="contactPersonPhone" class="form-label">Contact Person Phone</label>
                    <input type="text" class="form-control" id="contactPersonPhone" name="contactPersonPhone" placeholder="Enter contact person's phone number" required>
                </div>

                <button type="submit" class="btn btn-submit">Submit Profile</button>
            </form>
        </div>
    </div>

    <script>
         // Add event listener for form submission
        //  document.getElementById('companyProfileForm').addEventListener('submit', function(event) {
            // Prevent the default form submission
            function handleFormSubmission(event){
             event.preventDefault();
            
             // Get the form element
            const form = document.getElementById('companyProfileForm');
            if (!form) {
            console.error("Form element not found");
            return;
       }
            
            // Get the form data
            const formData = new FormData(this);
            const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;
    fetch(this.action, {
    method: "POST",
    body: formData,
    headers: {
        "X-CSRFToken": csrfToken,
        "X-Requested-With": "XMLHttpRequest"
    },
})
.then(response => {
    console.log(response);  // Log the response to debug
    if (response.ok) {
        return response.json();
    } else {
        throw new Error('Network response was not ok');
    }
})
.then(data => {
    console.log("Server Response Data:", data);  // Debugging the data received
    if (data && data.success) {
        window.location.href = data.redirect_url;
    } else {
        alert("Error: " + (data.error || "Unknown error occurred."));
    }
})
.catch(error => {
    console.error("Error:", error);
    alert("There was an error submitting your form.");
});



};

  // Add event listener for form submission
// document.getElementById('companyProfileForm').addEventListener('submit', handleFormSubmission);      
    </script>

</body>

</html>
