<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your CV</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin: 10px 0 5px;
            font-weight: bold;
        }
        input, textarea, select {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background:#000000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #222;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Your CV</h1>
        <form id="cvForm" method="POST" action="{% url 'jobseekercv' %}">
            {% csrf_token %} <!-- Ensure this is correctly included -->
            
            <label for="fullName">Full Name:</label>
            <!-- <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required> -->
            <input type="text" id="fullName" name="fullName" value="{{ jobseeker.full_name|default_if_none:'' }}" required>
            
            <label for="email">Email:</label>
            <!-- <input type="email" id="email" name="email" placeholder="Enter your email" required> -->
            <input type="email" id="email" name="email" value="{{ jobseeker.email|default_if_none:'' }}" required>

            <label for="phone">Phone Number:</label>
            <!-- <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required> -->
            <input type="tel" id="phone" name="phone" value="{{ jobseeker.phone|default_if_none:'' }}" required>

            <label for="location">Location:</label>
            <!-- <input type="text" id="location" name="location" placeholder="Enter your location" required> -->
            <input type="text" id="location" name="location" value="{{ jobseeker.location|default_if_none:'' }}" required>

            <label for="skills">Interpersonal Skills:</label>
            <!-- <input type="text" id="skills" name="skills" required> -->
            <input type="text" id="skills" name="skills" value="{{ jobseeker.interpersonal_skills|default_if_none:'' }}" required>

            <label for="technicalSkills">Technical Skills:</label>
            <!-- <input type="text" id="technicalSkills" name="technicalSkills" required> -->
            <input type="text" id="technicalSkills" name="technicalSkills" value="{{ jobseeker.technical_skills|default_if_none:'' }}" required>

            <label for="experience">Experience:</label>
            <!-- <textarea id="experience" name="experience" rows="5" placeholder="Describe your work experience" required></textarea> -->
            <textarea id="experience" name="experience" rows="5" required>{{ jobseeker.experience|default_if_none:'' }}</textarea>

            <label for="education">Education:</label>
            <!-- <textarea id="education" name="education" rows="5" placeholder="Describe your educational background" required></textarea> -->
            <textarea id="education" name="education" rows="5" required>{{ jobseeker.education|default_if_none:'' }}</textarea>
            
            <button type="submit">Generate CV</button>
        </form>
    </div>

    <script>
//    document.getElementById("cvForm").addEventListener("submit", function (event) {
//     event.preventDefault();  // Prevent the default form submission
    function handleFormSubmission(event){
             event.preventDefault();
            
             // Get the form element
            const form = document.getElementById('cvForm');
            if (!form) {
            console.error("Form element not found");
            return;
       }
    const formData = new FormData(this);
    const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;
    fetch(this.action, {
    method: "POST",
    body: formData,
    headers: {
        "X-CSRFToken": csrfToken,
        "X-Requested-With": "XMLHttpRequest"
    },
})
.then(response => {
    console.log(response);  // Log the response to debug
    if (response.ok) {
        return response.json();
    } else {
        throw new Error('Network response was not ok');
    }
})
.then(data => {
    console.log("Server Response:", data);  // Debugging server response
    if (data && data.success) {
        window.location.href = data.redirect_url;
    } else {
        alert("Error " + (data.error || "Unknown error occurred."));
    }
})
.catch(error => {
    console.error("Error:", error);
    alert("There was an error submitting your form.");
});

};

    </script>
</body>
</html>
