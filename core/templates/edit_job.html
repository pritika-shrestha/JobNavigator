<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #333;
            color: white;
            padding-top: 20px;
        }

        .sidebar a {
            padding: 15px 20px;
            text-decoration: none;
            color: white;
            display: block;
            font-size: 16px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #575757;
        }

        .content {
            margin-left: 250px;
            padding: 20px;
        }

        h2 {
            font-size: 24px;
            font-weight: bold;
        }

        .salary-input {
            display: none;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h3 class="text-center text-white">Company Profile</h3>
        <a href="{% url 'employer_dashboard' %}">Dashboard</a>
        <a href="{% url 'notifications' %}">Notifications</a>
        <a href="{% url 'company_manage_jobs' %}">Manage Jobs</a>
        <a href="{% url 'company_post_job' %}">Post Job</a>
    </div>

    <div class="content">
        <h2>Edit Job</h2>
        <form id="editJobForm" method="POST" action="{% url 'edit_job' job.id %}">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="JobTitle" class="form-label">Job Title</label>
                <input type="text" class="form-control" name="job_title" id="JobTitle" value="{{ job.JobTitle }}" required>
            </div>

            <div class="mb-3">
                <label for="JobDescription" class="form-label">Job Description</label>
                <textarea class="form-control" name="job_description" id="JobDescription" rows="4" required>{{ job.JobDescription }}</textarea>
            </div>

            <div class="mb-3">
                <label for="JobLocation" class="form-label">Job Location</label>
                <input type="text" class="form-control" name="job_location" id="JobLocation" value="{{ job.JobLocation }}" required>
            </div>

            <div class="mb-3">
                <label for="JobRequirements" class="form-label">Job Requirements</label>
                <textarea class="form-control" name="job_requirements" id="JobRequirements" rows="4" required>{{ job.JobRequirements }}</textarea>
            </div>

            <div class="mb-3">
                <label for="JobType" class="form-label">Job Type</label>
                <select class="form-control" name="job_type" id="JobType" required>
                    <option value="Full-time" {% if job.JobType == "Full-time" %}selected{% endif %}>Full-time</option>
                    <option value="Part-time" {% if job.JobType == "Part-time" %}selected{% endif %}>Part-time</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="ApplicationDeadline" class="form-label">Application Deadline</label>
                <input type="date" class="form-control" name="job_deadline" id="ApplicationDeadline" value="{{ job.ApplicationDeadline|date:'Y-m-d' }}" required>
            </div>

            <div class="mb-3">
                <label for="ManpowerRequired" class="form-label">Manpower Required</label>
                <input type="number" class="form-control" name="manpower_required" id="ManpowerRequired" value="{{ job.ManpowerRequired }}" required>
            </div>

            <div class="mb-3">
                <label for="SalaryType" class="form-label">Salary</label><br>
                <input type="radio" id="manualSalary" name="salary_type" value="Manual" {% if job.SalaryType == "Manual" %}checked{% endif %}>
                <label for="manualSalary">Manual</label><br>
                <input type="radio" id="rangeSalary" name="salary_type" value="Range" {% if job.SalaryType == "Range" %}checked{% endif %}>
                <label for="rangeSalary">Range</label><br>
                <input type="radio" id="negotiableSalary" name="salary_type" value="Negotiable" {% if job.SalaryType == "Negotiable" %}checked{% endif %}>
                <label for="negotiableSalary">Negotiable</label>
            </div>

            <div id="manualSalaryInput" class="salary-input" {% if job.SalaryType == "Manual" %}style="display:block;"{% endif %}>
                <label for="SalaryManual" class="form-label">Enter Salary</label>
                <input type="number" class="form-control" id="SalaryManual" name="salary_manual" value="{{ job.SalaryManual }}">
            </div>

            <div id="salaryRangeInput" class="salary-input" {% if job.SalaryType == "Range" %}style="display:block;"{% endif %}>
                <label for="SalaryRange" class="form-label">Enter Salary Range</label>
                <input type="number" class="form-control" id="SalaryRangeMin" name="salary_range_min" value="{{ job.SalaryRangeMin }}">
                <input type="number" class="form-control" id="SalaryRangeMax" name="salary_range_max" value="{{ job.SalaryRangeMax }}">
            </div>

            <button type="submit" class="btn btn-primary">Update Job</button>
        </form>
        
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const manualSalaryRadio = document.getElementById('manualSalary');
                const rangeSalaryRadio = document.getElementById('rangeSalary');
                const negotiableSalaryRadio = document.getElementById('negotiableSalary');
                const manualSalaryInput = document.getElementById('manualSalaryInput');
                const salaryRangeInput = document.getElementById('salaryRangeInput');

                manualSalaryRadio.addEventListener('change', function () {
                    manualSalaryInput.style.display = 'block';
                    salaryRangeInput.style.display = 'none';
                });

                rangeSalaryRadio.addEventListener('change', function () {
                    salaryRangeInput.style.display = 'block';
                    manualSalaryInput.style.display = 'none';
                });

                negotiableSalaryRadio.addEventListener('change', function () {
                    manualSalaryInput.style.display = 'none';
                    salaryRangeInput.style.display = 'none';
                });
            });
        </script>
    </div>
</body>

</html>
