<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JobEntry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .login-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
        }

        .login-form-container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }

        .toggle-btns {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .toggle-btn {
            width: 120px;
            padding: 10px;
            margin: 0 10px;
            border: none;
            border-radius: 5px;
            background-color: #f0f0f0;
            cursor: pointer;
            font-weight: bold;
        }

        .toggle-btn.active {
            background-color: #2683ee;
            color: white;
        }

        .login-form {
            display: none;
        }

        .login-form.active {
            display: block;
        }

        .form-label {
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
            text-align: center;
        }

        .success {
            color: green;
            font-weight: bold;
            text-align: center;
        }

        .forgot-password {
            display: block;
            text-align: center;
            font-size: 14px;
            color: #2683ee;
            font-weight: bold;
            margin-top: 10px;
            text-decoration: none; /* Remove underline */
        }

        .forgot-password:hover {
            color: #1a5bbf; /* Slightly darker shade on hover */
            text-decoration: none; /* Ensure underline does not appear */
        }
        a {
            text-decoration: none; /* Remove underline */
            color: #2683ee;
            font-weight: bold;
        }

        a:hover {
            color: #1a5bbf; /* Slightly darker shade on hover */
            text-decoration: none; /* Ensure underline does not appear */
        }

        .text-center p {
            display: inline; /* Keep the text and link in the same line */
        }

        .text-center a {
            margin-left: 5px; /* Optional, for slight spacing between the text and link */
        }


    </style>
</head>

<body>

    <div class="container-fluid login-container">
        <div class="login-form-container">
            <div class="toggle-btns">
                <button class="toggle-btn active" id="jobSeekerLoginBtn">Job Seeker</button>
                <button class="toggle-btn" id="employerLoginBtn">Employer</button>
            </div>

            <div id="messageBox"></div> <!-- Message Box for Errors -->

            <!-- Job Seeker Login Form -->
            <div class="login-form job-seeker-form active">
                <h2 class="text-center mb-4">Job Seeker Login</h2>
                <form id="jobSeekerLoginForm" method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="user_type" value="seeker">
                    <div class="mb-3">
                        <label for="seekerEmail" class="form-label"  >Email</label>
                        <input type="email" class="form-control" id="seekerEmail" name="email" placeholder="Enter your email" required autocomplete="off">
                    </div>
                    <div class="mb-3">
                        <label for="seekerPassword" class="form-label" >Password</label>
                        <input type="password" class="form-control" id="seekerPassword" name="password" placeholder="Enter your password" requiredb autocomplete="off">
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-3">Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
                <p><a href="{% url 'password_reset' %}" class="forgot-password">Forgot Password?</a></p>
            </div>

            <!-- Employer Login Form -->
            <div class="login-form employer-form">
                <h2 class="text-center mb-4">Employer Login</h2>
                <form id="employerLoginForm" method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="user_type" value="employer">
                    <div class="mb-3">
                        <label for="employerEmail" class="form-label"  >Email</label>
                        <input type="email" class="form-control" id="employerEmail" name="email" placeholder="Enter your email" required autocomplete="off">
                    </div>
                    <div class="mb-3">
                        <label for="employerPassword" class="form-label" >Password</label>
                        <input type="password" class="form-control" id="employerPassword" name="password" placeholder="Enter your password" required autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-3">Don't have an account? <a href="{% url 'signup' %}" >Sign Up</a></p>
                <p><a href="{% url 'password_reset' %}" class="forgot-password">Forgot Password?</a></p>
            </div>

        </div>
    </div>

    <script>
        const jobSeekerLoginBtn = document.getElementById('jobSeekerLoginBtn');
        const employerLoginBtn = document.getElementById('employerLoginBtn');
        const jobSeekerForm = document.querySelector('.job-seeker-form');
        const employerForm = document.querySelector('.employer-form');
        const messageBox = document.getElementById("messageBox");

        jobSeekerLoginBtn.addEventListener('click', () => {
            jobSeekerForm.classList.add('active');
            employerForm.classList.remove('active');
            jobSeekerLoginBtn.classList.add('active');
            employerLoginBtn.classList.remove('active');
        });

        employerLoginBtn.addEventListener('click', () => {
            employerForm.classList.add('active');
            jobSeekerForm.classList.remove('active');
            employerLoginBtn.classList.add('active');
            jobSeekerLoginBtn.classList.remove('active');
        });

        function handleLogin(formId, emailId, passwordId, userType, redirectUrl) {
    document.getElementById(formId).addEventListener("submit", function(event) {
        event.preventDefault();

        let formData = {
            email: document.getElementById(emailId).value,
            password: document.getElementById(passwordId).value,
            user_type: userType
        };

        fetch("/login/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCookie("csrftoken") 
            },
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(data => {
            console.log("Server Response:", data);  // Debugging

            if (data.error) {
                messageBox.innerHTML = `<div class="error">${data.error}</div>`;
            } else if (data.success) {
                let fullRedirectUrl = new URL(data.redirect_url, window.location.origin);
                console.log("Redirecting to:", fullRedirectUrl.href);
                window.location.href = fullRedirectUrl.href;  // ✅ Fix redirect issue
            } else {
                messageBox.innerHTML = `<div class="error">Unexpected response!</div>`;
            }
        })
        .catch(error => console.error("Fetch Error:", error));
    });
}


        handleLogin("jobSeekerLoginForm", "seekerEmail", "seekerPassword", "seeker", "/jobseeker/dashboard/");
        handleLogin("employerLoginForm", "employerEmail", "employerPassword", "employer", "/employer/dashboard/");

        function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        let cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            let cookie = cookies[i].trim();
            if (cookie.startsWith(name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
    </script>

</body>
</html>
